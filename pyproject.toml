[project]
name = "aimap"
version = "0.1.0"
description = "AI 论文领域地图:爬虫采集 → 多层分类/Agent 锚定 → 四元数领域树与地图 → 可视化跳转"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# 图书馆模拟浏览器登录(可选,按需安装)
library = [
    "playwright>=1.40",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
